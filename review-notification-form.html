<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Artwork Review Notification Form</title></head><body>
<!-- Netlify scans this static form during deployment; reviewers never use this page directly. -->
<form name="artwork-review-complete" method="POST" data-netlify="true" action="/review-notification-form.html">
<input type="hidden" name="form-name" value="artwork-review-complete">
<input type="hidden" name="subject" value="Artwork review complete">
<input type="hidden" name="view"><input type="hidden" name="completed_at">
<input type="hidden" name="approved"><input type="hidden" name="rejected">
<input type="hidden" name="total"><input type="hidden" name="view_url">
<textarea name="report" hidden></textarea>
</form></body></html>
